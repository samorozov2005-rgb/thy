spring.application.name=task-manager
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=always

# Учебный секрет длиной более 256 бит. В production он должен приходить из переменной окружения.
app.jwt.secret=educational-task-manager-jwt-secret-key-2026
app.jwt.expiration-ms=3600000
